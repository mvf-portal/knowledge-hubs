# Eine Meldung ueber alle Hubs, nachdem deren naechtliche Laeufe durch sind.
#
# **Nur ueber den Dirigenten, kein eigener Zeitplan.** Bis zum 10.09.2026 stand
# hier zusaetzlich ein cron auf 03:45 UTC. Damit lief der Workflow jeden
# Werktag zweimal - einmal per Zeitplan, einmal vom Dirigenten angestossen -
# und legte jedes Mal einen Beitragsentwurf an. Der fruehe Lauf war dabei
# immer der schlechtere: Er lief VOR dem Wecken der Portale und meldete den
# Stand des Vortags. Am 10.09.2026 standen deshalb "66 Studien" (03:55) und
# "72 Studien" (04:24) nebeneinander im Entwurfsordner, und die Redaktion
# musste taeglich einen von zweien loeschen.
#
# Der Dirigent weckt erst die zwoelf Portale, wartet und stoesst dann diesen
# Workflow an - er ist damit der Einzige, der den vollstaendigen Stand sieht.
# Die Uhrzeit steht folglich in dirigent.yml; sie muss nach den Portallaeufen
# und vor 10:00 Ortszeit liegen (Veto-Fenster der Redaktion).
name: Versand-Bericht (täglich)

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: write        # fuer den taeglichen Bau von studien.json

jobs:
  bericht:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Zuerst sammeln: Der Bericht nimmt die Studien in die Tageszusammen-
      # fassung auf, wenn die Datei da ist. continue-on-error, weil die
      # Veto-Meldung die wichtigere ist - sie muss auch dann kommen, wenn das
      # Einsammeln scheitert.
      # Nur die Tagesnews braucht ein Paket; alles andere kommt mit der
      # Standardbibliothek aus.
      - name: Abhängigkeiten installieren
        run: pip install --quiet "anthropic>=0.40"

      - name: Studien aller Hubs einsammeln
        continue-on-error: true
        run: python scripts/studien_sammeln.py

      - name: Statusdateien einsammeln und Meldung anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/versand_bericht.py

      # Die Tagesnews haengt an der Sammeldatei. continue-on-error, weil weder
      # Veto-Meldung noch Sammeldatei daran scheitern duerfen: Ein Aussetzer der
      # Meldung auf m-vf.de ist aergerlich, ein ausgefallener Bericht schlimmer.
      - name: Tagesnews schreiben und verschicken
        continue-on-error: true
        env:
          KNOWLEDGEHUBS: ${{ secrets.KNOWLEDGEHUBS }}
          KNOWLEDGEHUBSMC: ${{ secrets.KNOWLEDGEHUBSMC }}
          WPUSER: ${{ secrets.WPUSER }}
          WPPASSWORT: ${{ secrets.WPPASSWORT }}
        run: python scripts/tagesnews.py

      - name: studien.json committen (nur bei Aenderung)
        run: |
          if [ -z "$(git status --porcelain studien.json)" ]; then
            echo "Keine Aenderung - nichts zu committen."
            exit 0
          fi
          git config user.name  "Knowledge-Hubs Bot"
          git config user.email "stegmaier@m-vf.de"
          git add studien.json
          git commit -m "Studien aller Hubs, Stand $(TZ=Europe/Berlin date +%d.%m.%Y)"
          git push

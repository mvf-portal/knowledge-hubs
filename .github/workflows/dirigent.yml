# Ein Weckruf von aussen, sechzehn Laeufe - der Dirigent.
#
# GitHubs Cron ist "best effort" und hat am 27. und 28.08.2026 zwei Naechte
# hintereinander gar nichts ausgeloest, obwohl alle Workflows aktiv waren und
# jeder Start von Hand sofort lief. Die Ausfuehrung bei GitHub ist also
# verlaesslich, nur die AUSLOESUNG nicht.
#
# Deshalb kommt der Weckruf von aussen - vom Cron des MVF-Servers, siehe
# mvf-server/LIESMICH.md - und trifft NUR dieses Repo:
#
#   MVF-Server  --repository_dispatch-->  Dirigent  --workflow_dispatch--> 15 Hubs
#
# Der Vorteil dieser Kette: Der Server macht einen einzigen Aufruf, und die
# Verteilung auf fuenfzehn Repos geschieht innerhalb von GitHub. Am 30.08.2026
# gegen eine Fassung mit Cloudflare-Worker entschieden - der Server laeuft
# ohnehin durch, und der Schluessel bleibt im Haus.
#
# Es ist EIN Token an zwei Stellen: hier als Secret DIRIGENT_TOKEN (Actions:
# write, zum Starten der fuenfzehn Portale) und auf dem Server in
# wecker-zugang.php (Contents: write, fuer repository_dispatch).
#
# Doppelte Weckrufe kosten nichts: update_studies.py bricht ab, wenn das Archiv
# fuer heute schon Studien hat.
name: Dirigent (Weckruf von außen)

on:
  repository_dispatch:
    types: [morgenlauf]
  workflow_dispatch:
    inputs:
      nur_studien:
        description: "Nur Studien holen, keine Kampagne anlegen"
        type: boolean
        default: false

permissions: {}

# Die zwanzig Hubs stehen HIER und nur hier. Bis zum 14.11.2026 stand die
# Liste im Schleifenkopf, und als am 13.11. fuenf Hubs dazukamen, geriet
# dabei statt einer Zeilenfortsetzung das Zeichenpaar Rueckstrich-n in den
# Schleifenkopf, also wortwoertlich zwei Zeichen auf EINER Zeile: Der
# Lauf vom 14.11. um 04:20 UTC weckte alle zwanzig richtig und meldete
# zusaetzlich "n liess sich nicht anstossen". Harmlos, aber eine Liste, die
# an zwei Stellen steht, laeuft auseinander - und die Spuren unten brauchen
# dieselbe.
env:
  HUBS: >-
    versorgungsforschung-portal klima-gesundheit-portal ki-gesundheit-portal
    pflege-portal longevity-portal healthliteracy-portal impfen-portal
    ncd-portal gender-portal adipositas-portal safety-portal mental-portal
    onkologie-portal kardio-portal diabetes-portal
    auge-portal muskel-portal kinder-portal neuro-portal genom-portal

jobs:
  wecken:
    runs-on: ubuntu-latest
    steps:
      # Zuerst, und mit Absicht vor den Hubs: Der Newsletter hat mit ihnen
      # nichts zu tun, und ein Hub, der klemmt, darf ihn nicht mitreißen.
      #
      # Ob überhaupt etwas entsteht, entscheidet der Torwächter im Skript:
      # Montag, mindestens zehn Tage seit der letzten Ausgabe, kein offener
      # Entwurf. An allen anderen Tagen kostet der Aufruf zwei Sekunden.
      #
      # Warum hier und nicht im Cron von newsletter-entwurf.yml: GitHubs Cron
      # ist best effort und hat den Lauf am 14.09.2026 ausgelassen — genau am
      # ersten Montag, an dem er zählte. Der Weckruf vom MVF-Server kommt
      # zuverlässig. Der Cron dort bleibt als zweites Netz; wer zuerst kommt,
      # legt an, der andere findet einen offenen Entwurf und tut nichts.
      - name: Newsletter-Entwurf anstoßen
        env:
          GH_TOKEN: ${{ secrets.DIRIGENT_TOKEN }}
        run: gh workflow run newsletter-entwurf.yml -R mvf-portal/knowledge-hubs

      - name: Die zwanzig Hubs anstoßen
        env:
          # Fein granuliertes Token mit "Actions: write" auf den fünfzehn
          # Portal-Repos. Ohne dieses Secret bricht der Lauf sofort ab - der
          # GITHUB_TOKEN dieses Repos darf in fremden Repos nichts starten.
          GH_TOKEN: ${{ secrets.DIRIGENT_TOKEN }}
          NUR_STUDIEN: ${{ inputs.nur_studien && 'true' || 'false' }}
        run: |
          set -u
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::DIRIGENT_TOKEN fehlt - siehe mvf-server/LIESMICH.md"
            exit 1
          fi
          # Gestaffelt, nicht alle auf dieselbe Sekunde.
          #
          # Die fuenfzehn Hubs teilen sich EIN Mailchimp-Konto, und Mailchimp
          # laesst je Konto nur zehn gleichzeitige Verbindungen zu. Am
          # 22.09.2026 fielen drei Hubs in diese Grenze (429 "You have exceeded
          # the limit of 10 simultaneous connections"): Pflege, NCD und
          # Onkologie verloren ihre Ausgabe des Tages. Dieselbe Minute trifft
          # auch PubMed - der Longevity-Hub stoppte am selben Morgen, weil der
          # Abgleich eine leere Antwort bekam und daraufhin ALLE sechs Studien
          # als "bei PubMed nicht auffindbar" meldete. Alle sechs gab es.
          #
          # Zwanzig Sekunden Abstand verteilen die Mailchimp-Schritte ueber
          # gut vier Minuten; gleichzeitig dort sind dann etwa vier Hubs statt
          # fuenfzehn. Der letzte startet knapp fuenf Minuten nach dem ersten -
          # bei einem Weckruf um 06:20 und Versand um 10:00 faellt das nicht
          # ins Gewicht.
          #
          # Die Staffelung ist die erste Linie, die Wiederholung bei 429 in
          # mailchimp_entwurf.py die zweite. Beide zusammen, denn gestaffelt
          # heisst nicht einzeln: Laeufe unterschiedlicher Laenge holen den
          # Abstand wieder ein.
          STAFFEL=20
          ERSTER=1
          FEHLER=0
          for REPO in $HUBS
          do
            if [ "$ERSTER" -eq 1 ]; then
              ERSTER=0
            else
              sleep "$STAFFEL"
            fi
            if gh workflow run update-studies.yml -R "mvf-portal/$REPO" \
                 -f nur_studien="$NUR_STUDIEN"; then
              echo "angestoßen: $REPO"
            else
              echo "::warning::$REPO ließ sich nicht anstoßen"
              FEHLER=$((FEHLER+1))
            fi
          done
          echo "$FEHLER Repo(s) ohne Start."
          # Ein einzelner Ausfall darf die übrigen vierzehn nicht mitreißen; erst
          # wenn NICHTS lief, ist der Weckruf gescheitert.
          [ "$FEHLER" -lt 20 ]

      # Der Sammelbericht liest die Statusdateien der Hubs. Er braucht Vorlauf,
      # deshalb erst nach einer Weile - die Hubs brauchen ein bis zwei Minuten.
      #
      # Gemessen wird ab dem LETZTEN Weckruf, und der liegt seit der Staffelung
      # rund fuenf Minuten nach dem ersten. Der Schritt darueber hat diese Zeit
      # bereits verbraucht, die Wartezeit hier gilt also weiterhin dem zuletzt
      # geweckten Hub. Der zuerst geweckte hat dann gut neun Minuten gehabt.
      - name: Warten, bis die Hubs durch sind
        # Seit 13.11.2026 zwanzig Hubs: Der letzte startet gut sechs Minuten nach
        # dem ersten, die Wartezeit gilt weiter ihm.
        run: sleep 240

      - name: Sammelbericht anstoßen
        env:
          GH_TOKEN: ${{ secrets.DIRIGENT_TOKEN }}
        run: gh workflow run versand-bericht.yml -R mvf-portal/knowledge-hubs

  # ------------------------------------------------------------------
  # Wochen- und Monatsausgabe. Seit dem 14.11.2026, auf Peters Freigabe.
  #
  # Warum hier und nicht als zwei Cron-Zeilen in update-studies.yml: Der
  # Auftrag lautete zwar "zwei neue Zeitplaene", aber GitHubs Cron ist der
  # unzuverlaessigste Ausloeser, den wir haben - die Kommentare in
  # update-studies.yml fuehren die Ausfaelle einzeln auf, bis hin zu zwei
  # Naechten ohne jeden Lauf (27./28.08.2026). Eine ausgefallene Tagesausgabe
  # holt der naechste Morgen ein. Eine ausgefallene Wochenausgabe ist eine
  # Woche, eine ausgefallene Monatsausgabe ein Monat. Deshalb haengen beide
  # am Weckruf des MVF-Servers, der traegt.
  #
  # Der Kalender steht an ZWEI Stellen, mit Absicht: hier, damit an anderen
  # Tagen gar nichts angestossen wird, und in `spur_faellig()` in
  # mailchimp_entwurf.py, das jeden Anstoss nachprueft und an einem falschen
  # Tag ohne Kosten abbricht. Ein Handstart am Dienstag legt also nichts an.
  spuren:
    needs: wecken
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Welche Ausgabe ist heute fällig?
        id: kalender
        run: |
          set -u
          # Ortszeit, nicht UTC: Der Freitag der Ausgabe ist der deutsche.
          TAG=$(TZ=Europe/Berlin date +%u)     # 1=Montag ... 7=Sonntag
          NUM=$(TZ=Europe/Berlin date +%-d)    # Tag im Monat, ohne fuehrende Null
          DATUM=$(TZ=Europe/Berlin date +%F)
          SPUREN=""
          [ "$TAG" = "5" ] && SPUREN="woche"
          # Erster Werktag des Monats: der 1., oder der 2./3., wenn der 1. auf
          # Samstag oder Sonntag fiel.
          if [ "$TAG" -le 5 ]; then
            if [ "$NUM" = "1" ] \
               || { [ "$NUM" = "2" ] && [ "$TAG" = "1" ]; } \
               || { [ "$NUM" = "3" ] && [ "$TAG" = "1" ]; }; then
              SPUREN="$SPUREN monat"
            fi
          fi
          SPUREN=$(echo $SPUREN)
          echo "$DATUM (Wochentag $TAG, Monatstag $NUM) -> ${SPUREN:-keine Spur}"
          echo "spuren=$SPUREN" >> "$GITHUB_OUTPUT"

      # Die Tagesausgabe muss durch sein: Sie committet studien-archiv.json,
      # und daraus waehlt die Wochen- oder Monatsausgabe. Der Job `wecken` hat
      # beim Start hier bereits rund zehn Minuten verbraucht (Staffelung plus
      # die vier Minuten vor dem Sammelbericht); zwanzig weitere reichen auch
      # dem langsamsten Hub.
      - name: Warten, bis die Tagesausgabe durch ist
        if: steps.kalender.outputs.spuren != ''
        run: sleep 1200

      - name: Die fällige Ausgabe in allen Hubs anstoßen
        if: steps.kalender.outputs.spuren != ''
        env:
          GH_TOKEN: ${{ secrets.DIRIGENT_TOKEN }}
          SPUREN: ${{ steps.kalender.outputs.spuren }}
        run: |
          set -u
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::DIRIGENT_TOKEN fehlt - siehe mvf-server/LIESMICH.md"
            exit 1
          fi
          # Dieselbe Staffelung wie beim Morgenlauf und aus demselben Grund:
          # Die zwanzig Hubs teilen sich EIN Mailchimp-Konto mit hoechstens
          # zehn gleichzeitigen Verbindungen.
          GESAMT=0
          FEHLER=0
          for SPUR in $SPUREN; do
            ERSTER=1
            for REPO in $HUBS; do
              if [ "$ERSTER" -eq 1 ]; then ERSTER=0; else sleep 20; fi
              GESAMT=$((GESAMT+1))
              if gh workflow run newsletter-spur.yml -R "mvf-portal/$REPO" \
                   -f spur="$SPUR"; then
                echo "angestoßen ($SPUR): $REPO"
              else
                echo "::warning::$REPO ließ sich für die $SPUR-Ausgabe nicht anstoßen"
                FEHLER=$((FEHLER+1))
              fi
            done
          done
          echo "$FEHLER von $GESAMT Anstößen ohne Start."
          # Wie beim Morgenlauf: Erst wenn NICHTS lief, ist es gescheitert.
          [ "$FEHLER" -lt "$GESAMT" ]

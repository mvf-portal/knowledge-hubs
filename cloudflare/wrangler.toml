name = "mvf-hubs-wecker"
main = "worker.js"
compatibility_date = "2026-08-28"

# 04:20 UTC = 06:20 deutscher Sommerzeit.
#
# Die Zeit ist bewusst gewaehlt: GitHub haette bis dahin seinen eigenen
# Zeitplan gehabt (03:03 bis 03:47 UTC, je Portal eine eigene Minute), und bis
# zum Versand um 10:00 Ortszeit bleiben ueber dreieinhalb Stunden. Ein
# doppelter Weckruf kostet nichts: update_studies.py bricht ab, wenn das
# Archiv fuer heute schon Studien hat.
#
# Cloudflare rechnet Cron-Ausdruecke IMMER in UTC - im Winter liegt der
# Weckruf also auf 05:20 Ortszeit. Das ist gewollt: frueher schadet nicht,
# spaeter waere gefaehrlich.
[triggers]
crons = ["20 4 * * *"]

# Zwei Geheimnisse, beide NICHT in dieser Datei:
#   wrangler secret put GITHUB_TOKEN      (fein granuliert, siehe LIESMICH.md)
#   wrangler secret put PROBE_GEHEIMNIS   (frei gewaehlt, fuer den Aufruf von Hand)
[observability]
enabled = true
